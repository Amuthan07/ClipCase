[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcase"
version = "1.1.1"
description = "Convert screen recording videos into structured QA test cases using AI vision"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Amuthan", email = "amuthan.cp12@gmail.com" }
]
keywords = ["qa", "testing", "test-cases", "ai", "cli", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "anthropic",
  "openai",
  "google-generativeai",
  "openpyxl",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
clipcase = "clipcase.cli:main"

[project.urls]
Homepage = "https://github.com/Amuthan07/ClipCase"
Repository = "https://github.com/Amuthan07/ClipCase"

[tool.setuptools]
# Only the published CLI ships to PyPI. eval/, production/, dashboard/, db/ are internal
# benchmarking and dashboard tooling for this repo, not part of the pip-installed package.
packages = ["clipcase"]
